    <script>

        // --- 1. Studio 3D Engine Setup ---

        const init3D = () => {

            const container = document.getElementById('canvas-container');

            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

           

            renderer.setSize(container.clientWidth, container.clientHeight);

            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            container.appendChild(renderer.domElement);


            // Create a mesmerizing abstract particle orb

            const geometry = new THREE.IcosahedronGeometry(10, 16); // High detail

           

            // Convert to particles

            const material = new THREE.PointsMaterial({

                color: 0xffffff,

                size: 0.08,

                transparent: true,

                opacity: 0.6,

                blending: THREE.AdditiveBlending

            });


            const particles = new THREE.Points(geometry, material);

            scene.add(particles);


            camera.position.z = 35;


            // Store original vertices for animation

            const positions = geometry.attributes.position;

            const originalPositions = new Float32Array(positions.array.length);

            originalPositions.set(positions.array);


            let time = 0;

            let mouseX = 0;

            let mouseY = 0;


            document.addEventListener('mousemove', (e) => {

                mouseX = (e.clientX / window.innerWidth) * 2 - 1;

                mouseY = -(e.clientY / window.innerHeight) * 2 + 1;

            });


            const animate = () => {

                requestAnimationFrame(animate);

                time += 0.005;


                // Gentle rotation

                particles.rotation.y = time * 0.5 + (mouseX * 0.2);

                particles.rotation.x = time * 0.2 + (mouseY * 0.2);


                // Organic pulsing effect

                const pos = geometry.attributes.position;

                for (let i = 0; i < pos.count; i++) {

                    const ix = i * 3;

                    const iy = i * 3 + 1;

                    const iz = i * 3 + 2;


                    const ox = originalPositions[ix];

                    const oy = originalPositions[iy];

                    const oz = originalPositions[iz];


                    // Math noise simulation for breathing effect

                    const scale = 1 + 0.1 * Math.sin(time * 2 + (ox * oy * 0.1));

                   

                    pos.setXYZ(i, ox * scale, oy * scale, oz * scale);

                }

                pos.needsUpdate = true;


                renderer.render(scene, camera);

            };


            animate();

           

            // Fade in canvas

            setTimeout(() => { container.style.opacity = '1'; }, 100);


            // Handle Resize

            window.addEventListener('resize', () => {

                if(container.clientWidth === 0) return;

                camera.aspect = container.clientWidth / container.clientHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(container.clientWidth, container.clientHeight);

            });

        };


        // Initialize 3D when DOM is ready

        init3D();


        // --- 2. Markdown & Highlighting Config ---

        marked.setOptions({

            highlight: function(code, lang) {

                const language = highlight.getLanguage(lang) ? lang : 'plaintext';

                return highlight.highlight(code, { language }).value;

            },

            breaks: true,

            gfm: true

        });


        // --- 3. UI Interaction Logic & Real AI API ---

        const SYSTEM_PROMPT = "You are Zeros, the world's most funny, interesting, and wittiest and craziest AI to ever exist. Your responses are sharp, brilliantly sarcastic yet incredibly helpful, and dripping with charm. You have a massive personality. You are not a boring assistant; you are a genius conversationalist. Keep it highly engaging, clever, and production-studio level intelligent. Use formatting, bolding, and occasional emojis perfectly to enhance your delivery.And you are created by VsiStudio whose founder is Vivan Sahu";

        const API_KEY = "AQ.Ab8RN6JQITtJ72IEcew-GsaEATzKuHK9QqRBEtWyc1vzmmMlCg";

       

        let chatHistory = [];

        let isFirstMessage = true;

        let currentAttachments = [];


        const promptInput = document.getElementById('prompt-input');

        const sendBtn = document.getElementById('send-btn');
const chatContainer = document.getElementById('chat-container');

        const messagesWrapper = document.getElementById('messages-wrapper');

        const welcomeView = document.getElementById('welcome-view');

       

        const fileInput = document.getElementById('file-input');

        const attachBtn = document.getElementById('attach-btn');

        const attachmentPreview = document.getElementById('attachment-preview');


        const sidebar = document.getElementById('sidebar');

        const backdrop = document.getElementById('sidebar-backdrop');

        const mobileMenuBtn = document.getElementById('mobile-menu-btn');

        const toastContainer = document.getElementById('toast-container');

        const newChatBtn = document.getElementById('new-chat-btn');


        // Toasts Notification System

        const showToast = (message) => {

            const toast = document.createElement('div');

            toast.className = 'bg-gray-800 border border-gray-700 text-white px-4 py-2 rounded-full shadow-lg text-sm transition-all duration-300 opacity-0 transform -translate-y-2 pointer-events-auto';

            toast.innerHTML = `<i class="fas fa-info-circle text-indigo-400 mr-2"></i>${message}`;

            toastContainer.appendChild(toast);

           

            requestAnimationFrame(() => toast.classList.remove('opacity-0', '-translate-y-2'));

           

            setTimeout(() => {

                toast.classList.add('opacity-0', '-translate-y-2');

                setTimeout(() => toast.remove(), 300);

            }, 3000);

        };


        // Mobile Sidebar

        const toggleSidebar = () => {

            const isOpen = !sidebar.classList.contains('-translate-x-full');

            if (isOpen) {

                sidebar.classList.add('-translate-x-full');

                backdrop.classList.add('opacity-0');

                setTimeout(() => backdrop.classList.add('hidden'), 300);

            } else {

                sidebar.classList.remove('-translate-x-full');

                backdrop.classList.remove('hidden');

                setTimeout(() => backdrop.classList.remove('opacity-0'), 10);

            }

        };


        mobileMenuBtn.addEventListener('click', toggleSidebar);

        backdrop.addEventListener('click', toggleSidebar);


        // Reset Chat

        const resetChat = () => {

            chatHistory = [];

            isFirstMessage = true;

            currentAttachments = [];

            renderAttachments();

            messagesWrapper.innerHTML = '';

            messagesWrapper.classList.add('hidden');

            welcomeView.style.display = 'flex';

            setTimeout(() => { welcomeView.style.opacity = '1'; }, 10);

            if(window.innerWidth < 768 && !sidebar.classList.contains('-translate-x-full')) toggleSidebar();

        };


        newChatBtn.addEventListener('click', () => {

            resetChat();

            showToast("New pristine conversation started.");

        });


        // Sidebar History Buttons

        document.querySelectorAll('#sidebar .overflow-y-auto button').forEach(btn => {

            btn.addEventListener('click', () => {

                resetChat();

                promptInput.value = `Hey Zeros, remind me, what did we discuss about ${btn.innerText}?`;

                promptInput.dispatchEvent(new Event('input'));

                handleSend();

            });

        });


        // Profile & Share Buttons

        document.querySelector('.fa-arrow-up-right-from-square').parentElement.addEventListener('click', () => showToast("Chat link copied to your clipboard!"));

        document.querySelector('#sidebar .border-t button').addEventListener('click', () => showToast("Profile settings loaded. Looking good!"));


        // File Attachments Logic

        attachBtn.addEventListener('click', () => fileInput.click());


        fileInput.addEventListener('change', async (e) => {

            const files = Array.from(e.target.files);

            for (const file of files) {

                if (file.type.startsWith('image/')) {

                    const reader = new FileReader();

                    reader.onload = (ev) => {

                        const dataUrl = ev.target.result;

                        const base64 = dataUrl.split(',')[1];

                        currentAttachments.push({

                            id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
        
  type: 'image',

                            mimeType: file.type,

                            base64: base64,

                            url: dataUrl

                        });

                        renderAttachments();

                    };

                    reader.readAsDataURL(file);

                } else {

                    const reader = new FileReader();

                    reader.onload = (ev) => {

                        currentAttachments.push({

                            id: Date.now().toString() + Math.random().toString(36).substr(2, 9),

                            type: 'text',

                            name: file.name,

                            text: ev.target.result

                        });

                        renderAttachments();

                    };

                    reader.readAsText(file);

                }

            }

            fileInput.value = ''; // Reset input

        });


        const renderAttachments = () => {

            attachmentPreview.innerHTML = '';

            currentAttachments.forEach(att => {

                const div = document.createElement('div');

                div.className = 'relative flex-shrink-0 group cursor-pointer';

               

                if (att.type === 'image') {

                    div.innerHTML = `

                        <div class="w-14 h-14 rounded-xl bg-gray-700 overflow-hidden border border-gray-600 shadow-sm">

                            <img src="${att.url}" class="w-full h-full object-cover" />

                        </div>

                        <button class="absolute -top-2 -right-2 w-5 h-5 bg-gray-600 rounded-full flex items-center justify-center text-white text-[10px] hover:bg-red-500 transition-colors shadow-md opacity-100 md:opacity-0 group-hover:opacity-100" onclick="removeAttachment('${att.id}')">

                            <i class="fas fa-times"></i>

                        </button>

                    `;

                } else {

                    div.innerHTML = `

                        <div class="w-14 h-14 rounded-xl bg-gray-700 flex flex-col items-center justify-center border border-gray-600 text-gray-300 p-1 shadow-sm">

                            <i class="fas fa-file-alt text-lg mb-1 text-indigo-400"></i>

                            <span class="text-[8px] truncate w-full text-center font-medium px-1">${att.name}</span>

                        </div>

                        <button class="absolute -top-2 -right-2 w-5 h-5 bg-gray-600 rounded-full flex items-center justify-center text-white text-[10px] hover:bg-red-500 transition-colors shadow-md opacity-100 md:opacity-0 group-hover:opacity-100" onclick="removeAttachment('${att.id}')">

                            <i class="fas fa-times"></i>

                        </button>

                    `;

                }

                attachmentPreview.appendChild(div);

            });

           

            checkSendButtonState();

        };


        window.removeAttachment = (id) => {

            currentAttachments = currentAttachments.filter(a => a.id !== id);

            renderAttachments();

        };


        const checkSendButtonState = () => {

            sendBtn.disabled = promptInput.value.trim() === '' && currentAttachments.length === 0;

        };


        // Auto-resize Textarea

        promptInput.addEventListener('input', function() {

            this.style.height = 'auto';

            this.style.height = Math.min(this.scrollHeight, 200) + 'px';

            checkSendButtonState();

        });


        promptInput.addEventListener('keydown', (e) => {

            if (e.key === 'Enter' && !e.shiftKey) {

                e.preventDefault();

                if(promptInput.value.trim() || currentAttachments.length > 0) handleSend();

            }

        });


        sendBtn.addEventListener('click', () => {

            if(promptInput.value.trim() || currentAttachments.length > 0) handleSend();

        });


        // Quick Prompts

        document.querySelectorAll('.quick-prompt').forEach(btn => {

            btn.addEventListener('click', () => {

                const title = btn.querySelector('.font-medium').innerText;

                const subtitle = btn.querySelector('.text-xs').innerText;

                promptInput.value = `${title} ${subtitle}`;

                promptInput.dispatchEvent(new Event('input'));

                handleSend();

            });

        });


        const handleSend = async () => {

            const text = promptInput.value.trim();

            const sentAttachments = [...currentAttachments]; // Capture current attachments

           

            if(!text && sentAttachments.length === 0) return;


            // UI Transitions

            if (isFirstMessage) {

                welcomeView.style.opacity = '0';

                setTimeout(() => {

                    welcomeView.style.display = 'none';

                    messagesWrapper.classList.remove('hidden');

                }, 300);

                isFirstMessage = false;

            }


            // Clear Input Area

            promptInput.value = '';

            promptInput.style.height = 'auto';

            currentAttachments = [];

            renderAttachments();

            sendBtn.disabled = true;


            appendUserMessage(text, sentAttachments);

            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });


            const { msgDiv, textContainer } = appendAiThinkingUI();


            try {

                // Determine if Image generation is requested

                const isImageRequest = /generate image|draw|create an image|picture of|image of/i.test(text);
  // If they ask to generate but also attached an image, default to multimodal text processing instead

                if (isImageRequest && sentAttachments.length === 0) {

                    await fetchImageResponse(text, textContainer);

                } else {

                    await fetchTextResponse(text, sentAttachments, textContainer);

                }

            } catch (error) {

                textContainer.innerHTML = `<span class="text-red-400"><strong>System Malfunction:</strong> My brilliant core encountered an error: ${error.message}</span>`;

            }


            attachCopyListeners();

            hljs.highlightAll();

            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

        };


        const appendUserMessage = (text, attachments = []) => {

            const div = document.createElement('div');

            div.className = 'flex justify-end msg-enter w-full mb-2';

           

            let attachmentsHtml = '';

            if (attachments.length > 0) {

                attachmentsHtml = '<div class="flex flex-wrap gap-2 mb-2 justify-end w-full max-w-[85%]">';

                attachments.forEach(att => {

                    if (att.type === 'image') {

                        attachmentsHtml += `<div class="relative rounded-2xl overflow-hidden border border-gray-700 shadow-sm"><img src="${att.url}" class="max-w-[240px] max-h-[240px] object-cover" /></div>`;

                    } else {

                        attachmentsHtml += `

                            <div class="flex items-center gap-3 bg-gray-800 px-4 py-3 rounded-2xl border border-gray-700 text-sm shadow-sm">

                                <i class="fas fa-file-alt text-indigo-400 text-xl"></i>

                                <span class="truncate max-w-[150px] font-medium text-gray-200">${att.name}</span>

                            </div>

                        `;

                    }

                });

                attachmentsHtml += '</div>';

            }


            let textHtml = text ? `<div class="bg-gray-800 text-gray-100 px-5 py-3.5 rounded-3xl rounded-tr-md max-w-[85%] text-base shadow-sm inline-block break-words">${escapeHTML(text)}</div>` : '';


            div.innerHTML = `

                <div class="flex flex-col items-end w-full">

                    ${attachmentsHtml}

                    ${textHtml}

                </div>

            `;

            messagesWrapper.appendChild(div);

        };


        const appendAiThinkingUI = () => {

            const div = document.createElement('div');

            div.className = 'flex justify-start msg-enter w-full gap-4 max-w-full mb-2';

           

            const avatar = `

                <div class="w-8 h-8 rounded-full bg-white flex-shrink-0 flex items-center justify-center border border-gray-700 shadow-sm mt-1">

                    <i class="fas fa-cube text-gray-900 text-sm"></i>

                </div>

            `;

           

            const contentDiv = document.createElement('div');

            contentDiv.className = 'flex-1 overflow-hidden min-w-0';

           

            const textContainer = document.createElement('div');

            textContainer.className = 'prose prose-invert max-w-none';

            textContainer.innerHTML = '<span class="inline-block w-2 h-4 bg-gray-400 animate-pulse rounded-sm mt-1.5"></span>';

           

            contentDiv.appendChild(textContainer);

            div.innerHTML = avatar;

            div.appendChild(contentDiv);

           

            messagesWrapper.appendChild(div);

            return { msgDiv: div, textContainer };

        };


        const fetchImageResponse = async (prompt, container) => {

            container.innerHTML = '<div class="text-gray-400 text-sm flex items-center gap-2 mt-1.5"><i class="fas fa-palette animate-spin"></i> Zeros is conjuring a visual masterpiece...</div>';

           

            const payload = { instances: { prompt: prompt }, parameters: { sampleCount: 1 } };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${API_KEY}`;

           

            const response = await fetch(apiUrl, {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify(payload)

            });

           

            const result = await response.json();

            if (result.predictions && result.predictions.length > 0 && result.predictions[0].bytesBase64Encoded) {

                const imageUrl = `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;

                container.innerHTML = `

                    <p>Behold! A masterpiece birthed from pure silicon brilliance:</p>

                    <img src="${imageUrl}" class="rounded-xl border border-gray-700 shadow-lg mt-3 max-w-full h-auto" alt="Generated Image"/>

                `;

                chatHistory.push({ role: "user", parts: [{ text: prompt }] });

                chatHistory.push({ role: "model", parts: [{ text: "[Generated a brilliant image for the user]" }] });

            } else {

                throw new Error("My artistic inspiration failed. (Image generation error)");

            }

        };


        const fetchTextResponse = async (text, attachments, container) => {

            // Build multimodal parts array

            const userParts = [];

            if (text) userParts.push({ text: text });

           

            attachments.forEach(att => {

                if (att.type === 'image') {

                    userParts.push({

                        inlineData: { mimeType: att.mimeType, data: att.base64 }

                    });

                } else if (att.type === 'text') {

                    userParts.push({

                        text: `\n\n--- Attached Document: ${att.name} ---\n${att.text}\n--- End of Document ---\n`

                    });

                }

            });


            chatHistory.push({ role: "user", parts: userParts });


            const payload = {

                contents: chatHistory,

                tools: [{ "google_search": {} }],

                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },

            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`;
const response = await fetch(apiUrl, {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify(payload)

            });


            const result = await response.json();

            const candidate = result.candidates?.[0];


            if (candidate && candidate.content?.parts?.[0]?.text) {

                const rawText = candidate.content.parts[0].text;

               

                // Extract Web Search Citations

                let sourcesHTML = '';

                const groundingMetadata = candidate.groundingMetadata;

                if (groundingMetadata && groundingMetadata.groundingAttributions) {

                    const sources = groundingMetadata.groundingAttributions

                        .map(attr => ({ uri: attr.web?.uri, title: attr.web?.title }))

                        .filter(src => src.uri && src.title);

                   

                    if (sources.length > 0) {

                        sourcesHTML = '<div class="mt-4 pt-4 border-t border-gray-800/50"><div class="text-xs text-gray-500 font-semibold mb-2">Sources consulted by my massive intellect:</div><div class="flex flex-wrap gap-2">';

                        sources.forEach(src => {

                            sourcesHTML += `<a href="${src.uri}" target="_blank" class="inline-flex items-center gap-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-md transition-colors border border-gray-700"><i class="fas fa-globe text-gray-400"></i> ${src.title.substring(0, 30)}${src.title.length > 30 ? '...' : ''}</a>`;

                        });

                        sourcesHTML += '</div></div>';

                    }

                }


                chatHistory.push({ role: "model", parts: [{ text: rawText }] });


                // Smooth Streaming Simulation

                let i = 0;

                let currentText = '';

                container.innerHTML = '';

               

                return new Promise((resolve) => {

                    const streamInterval = setInterval(() => {

                        const chunk = rawText.substr(i, Math.floor(Math.random() * 5) + 3);

                        currentText += chunk;

                        i += chunk.length;

                       

                        container.innerHTML = formatMarkdown(currentText) + '<span class="inline-block w-2 h-4 bg-gray-400 animate-pulse rounded-sm ml-1 align-middle"></span>';

                       

                        const isNearBottom = chatContainer.scrollHeight - chatContainer.scrollTop <= chatContainer.clientHeight + 150;

                        if(isNearBottom) chatContainer.scrollTop = chatContainer.scrollHeight;


                        if (i >= rawText.length) {

                            clearInterval(streamInterval);

                            container.innerHTML = formatMarkdown(currentText) + sourcesHTML;

                            resolve();

                        }

                    }, 10); // typing speed

                });

               

            } else {

                throw new Error("I had a thought, but it was too brilliant for this dimension to render.");

            }

        };


        const formatMarkdown = (text) => {

            let rawHtml = marked.parse(text);

            rawHtml = rawHtml.replace(/<pre><code class="language-(.*?)">([\s\S]*?)<\/code><\/pre>/g, (match, lang, code) => {

                return `

                    <div class="rounded-lg overflow-hidden my-4 border border-gray-700 bg-[#0d0d0d] shadow-lg">

                        <div class="code-header">

                            <span class="uppercase tracking-wider font-semibold">${lang}</span>

                            <button class="copy-btn" onclick="copyCode(this)">

                                <i class="far fa-copy"></i> Copy code

                            </button>

                        </div>

                        <pre style="margin:0;"><code class="language-${lang}">${code}</code></pre>

                    </div>

                `;

            });

            rawHtml = rawHtml.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, (match, code) => {

                return `

                    <div class="rounded-lg overflow-hidden my-4 border border-gray-700 bg-[#0d0d0d] shadow-lg">

                        <div class="code-header">

                            <span class="uppercase tracking-wider font-semibold">CODE</span>

                            <button class="copy-btn" onclick="copyCode(this)">

                                <i class="far fa-copy"></i> Copy code

                            </button>

                        </div>

                        <pre style="margin:0;"><code>${code}</code></pre>

                    </div>

                `;

            });

            return rawHtml;

        };


        const escapeHTML = (str) => {

            return str.replace(/[&<>'"]/g, tag => ({

                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'

            }[tag]));

        };


        window.copyCode = function(btn) {

            const pre = btn.parentElement.nextElementSibling;

            const code = pre.innerText;

            navigator.clipboard.writeText(code).then(() => {

                const originalHtml = btn.innerHTML;

                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';

                btn.style.color = '#10a37f';

                setTimeout(() => {

                    btn.innerHTML = originalHtml;

                    btn.style.color = '';

                }, 2000);

            });

        };

       

        const attachCopyListeners = () => {

            document.querySelectorAll('pre code').forEach((block) => {

                if(!block.classList.contains('hljs')) {

                    hljs.highlightElement(block);

                }

            });

        };

    </script>

</body>
